[Settings]
# Gaming-first DiscOpt kernel - aggressive idle trim, high priority, raw input
# 2000ms = floor of valid range (2000-15000) — lowest resident RAM while Discord is idle
EnableTrim=1
TrimIntervalMs=2000

EnablePriorityFix=1
PriorityClass=3

EnableThreadPriorityFix=1

RawInputMode=1
RawInputSleepMs=800
RawInputPatchDelayMs=1200
